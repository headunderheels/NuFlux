# NuFlux run configuration schema.
# Copy into a run directory as `run.conf`:
#   mkdir -p runs/my-run && cp examples/template.conf runs/my-run/run.conf
#
# All keys are required except where otherwise noted.

geometry:            10        # collider lattice: 3 or 10 (TeV CoM)
particle:            muon      # muon | antimuon (ultimately sets the neutrino flavor mix)
energy_cap:          none      # max neutrino energy to save (in GeV); `none` if no desired cap
distance:            200       # meters from the IP, snapped to the nearest element
particles:           100       # number of particles to fire

# Decay biasing: muons rarely decay in-region unbiased, so the effective
# lifetime is shortened and events re-weighted. `default` computes it from
# beam energy and distance; or give a lifetime in seconds (true value 2.2e-6).
muon_lifetime:       default

sample_all:          no        # samplers after every element (yes) or just the target plane (no)
delete_intermediate: yes       # discard MAD-X/GMAD/raw BDSIM files, keeping only the flux outputs

# Optional — where acc-models-mc is mounted. Defaults to /geometry, which is
# where the standard run command binds it. Leave commented unless you differ.
# geometry_dir:      /geometry