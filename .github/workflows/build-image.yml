name: Build and publish NuFlux image

# Triggers on version tags only — a README typo shouldn't kick off a multi-hour
# build. Tag a release (e.g. `git tag v0.2.0 && git push origin v0.2.0`) and
# this runs automatically. Also runnable manually via the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Image tag (defaults to git tag or "manual")'
        required: false
        default: ''

# The GITHUB_TOKEN needs packages:write to push to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The from-source build (GEANT4, BDSIM, GENIE) is heavy. On the maintainer's
    # cluster (~128 cores) it takes under an hour; on a 2-core GitHub runner
    # expect 2-4 hours. The 6-hour Actions timeout should be enough, but if it
    # isn't, switch to a larger runner or a self-hosted runner on the cluster.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y apptainer

      - name: Check disk space before build
        run: |
          echo "=== disk before build ==="
          df -h /
          echo "If this is under ~20 GB free, the build may run out of space."

      - name: Build the image
        run: |
          apptainer build --fakeroot nuflux.sif nuflux.def

      - name: Check disk space after build
        if: always()
        run: |
          echo "=== disk after build ==="
          df -h /
          ls -lh nuflux.sif

      - name: Validate the built image
        run: |
          apptainer exec nuflux.sif bash -c \
            '. /opt/root/bin/thisroot.sh && python3 -c "import ROOT; print(\"ROOT\", ROOT.gROOT.GetVersion())"'
          apptainer exec nuflux.sif bash -c \
            '. /opt/root/bin/thisroot.sh && python3 -c "import ROOT; print(\"libGTlFlx:\", ROOT.gSystem.Load(\"libGTlFlx\"))"'

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            TAG="${{ github.event.inputs.tag_override }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="manual"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image will be tagged: $TAG"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login \
              --username "${{ github.actor }}" \
              --password-stdin \
              oras://ghcr.io

      - name: Push to GHCR
        run: |
          apptainer push nuflux.sif \
            oras://ghcr.io/${{ github.repository_owner }}/nuflux:${{ steps.tag.outputs.tag }}
          echo "Pushed: ghcr.io/${{ github.repository_owner }}/nuflux:${{ steps.tag.outputs.tag }}"