name: Build and push NuFlux image to GHCR

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - patches/**
      - entrypoint.sh
      - .github/workflows/build-image.yml
  workflow_dispatch: {}   # lets you trigger a rebuild manually from the Actions tab

env:
  IMAGE_NAME: ${{ github.repository }}   # -> ghcr.io/<owner>/<repo>

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # NOTE: GEANT4+BDSIM compiling from source can exceed the default
    # GitHub-hosted runner's disk space and the 6-hour job time limit,
    # depending on how much gets cached. If this job runs out of disk,
    # add a disk-cleanup step before the build, or reduce
    # GEANT4_BUILD_MULTITHREADED-driven parallelism, or use a
    # larger/self-hosted runner.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
